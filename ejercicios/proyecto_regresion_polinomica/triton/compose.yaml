services:
  train-triton-models:
    build:
      context: ..
      dockerfile: triton/Dockerfile.trainer
    environment:
      TRITON_TRAIN_TEST_SIZE: "0.2"
      TRITON_RANDOM_STATE: "42"
      TRITON_POLYNOMIAL_DEGREE: "2"
      TRITON_RF_ESTIMATORS: "200"
    volumes:
      - ./model_repository:/model_repository
      - ./results:/results
    restart: "no"

  nvidia-triton:
    build:
      context: ..
      dockerfile: triton/Dockerfile.server
      args:
        TRITON_BASE_IMAGE: ${TRITON_BASE_IMAGE:-nvcr.io/nvidia/tritonserver:26.08-py3}
    command:
      - tritonserver
      - --model-repository=/models
      - --log-verbose=0
    depends_on:
      train-triton-models:
        condition: service_completed_successfully
    ports:
      - "18000:8000"
      - "18001:8001"
      - "18002:8002"
    volumes:
      - ./model_repository:/models:ro
    restart: unless-stopped

