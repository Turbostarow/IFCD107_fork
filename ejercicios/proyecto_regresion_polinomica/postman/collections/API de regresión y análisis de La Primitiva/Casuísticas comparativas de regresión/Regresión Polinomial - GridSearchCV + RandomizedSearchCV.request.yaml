scripts:
  - type: afterResponse
    code: |-
      pm.test("Regresión Polinomial: entrenamiento correcto", function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
        var result = pm.response.json();
        pm.test("Incluye mejor búsqueda e hiperparámetros", function () {
          pm.expect(["GridSearchCV", "RandomizedSearchCV"]).to.include(result.winner);
          pm.expect(result.best_parameters).to.be.an("object");
        });
        pm.test("Incluye métricas y PDF", function () {
          pm.expect(result.metrics.rmse).to.be.a("number");
          pm.expect(result.artifacts.report_pdf).to.be.a("string");
        });
        pm.collectionVariables.set("last_casuistica_polynomial", JSON.stringify(result));
      }
