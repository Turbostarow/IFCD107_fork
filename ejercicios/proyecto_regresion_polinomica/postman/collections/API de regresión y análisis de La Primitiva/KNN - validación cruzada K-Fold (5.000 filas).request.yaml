$kind: http-request
url: "{{baseUrl}}/api/v1/regresion/knn/kfold"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: formdata
  content:
    - type: text
      key: reference
      value: knn_5000_kfold_demo
    - type: text
      key: target
      value: y
    - type: text
      key: n_neighbors
      value: "5"
    - type: text
      key: cv
      value: "5"
    - type: text
      key: random_state
      value: "42"
    - type: file
      key: file
      src:
        - ../ejemplos/datos_knn_5000.csv
    - type: text
      key: search
      value: "false"
      description: Usa el catálogo de GET /api/v1/regresion/parametros cuando search=true.
    - type: text
      key: n_iter
      value: "10"
      description: Usa el catálogo de GET /api/v1/regresion/parametros cuando search=true.
    - type: text
      key: search_cv
      value: "5"
      description: Usa el catálogo de GET /api/v1/regresion/parametros cuando search=true.
order: 13000
