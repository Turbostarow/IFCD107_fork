$kind: http-request
url: "{{baseUrl}}/api/v1/random-forest/csv"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: formdata
  content:
    - type: text
      key: reference
      value: terrazas_rf_csv_demo
    - type: text
      key: target
      value: y
    - type: text
      key: n_estimators
      value: "200"
    - type: text
      key: max_depth
      value: ""
    - type: text
      key: test_size
      value: "0.2"
    - type: text
      key: random_state
      value: "42"
    - type: file
      key: file
      src:
        - ../ejemplos/datos_ejemplo_complejo.csv
    - type: text
      key: search
      value: "false"
      description: Usa el catálogo de GET /api/v1/regresion/parametros cuando search=true.
    - type: text
      key: n_iter
      value: "10"
      description: Usa el catálogo de GET /api/v1/regresion/parametros cuando search=true.
    - type: text
      key: search_cv
      value: "5"
      description: Usa el catálogo de GET /api/v1/regresion/parametros cuando search=true.
order: 15000
