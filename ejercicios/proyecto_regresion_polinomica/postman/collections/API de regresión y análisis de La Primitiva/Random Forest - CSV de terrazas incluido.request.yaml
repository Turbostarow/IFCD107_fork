$kind: http-request
url: "{{baseUrl}}/api/v1/random-forest/terrazas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "reference": "terrazas_rf_demo",
      "target": "y",
      "n_estimators": 200,
      "max_depth": null,
      "test_size": 0.2,
      "random_state": 42
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Random Forest responde correctamente", function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) { pm.collectionVariables.set("last_run_id", pm.response.json().run_id); }
    language: text/javascript
order: 10000
